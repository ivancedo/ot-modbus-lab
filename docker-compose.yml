networks:
  otlab:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.name: br-otlab
    ipam:
      config:
        - subnet: 172.20.0.0/24
  webui:
    driver: bridge

services:
  modbus-slave:
    build: ./slave
    container_name: modbus-slave
    hostname: mobus-slave
    networks:
      otlab:
        ipv4_address: 172.20.0.10
    restart: unless-stopped

  modbus-master:
    build: ./master
    container_name: modbus-master
    hostname: modbus-master
    networks:
      otlab:
        ipv4_address: 172.20.0.11
      webui:
    ports:
      - "8080:8080"
    depends_on:
      - modbus-slave
    restart: unless-stopped

  attacker:
    build: ./attacker
    container_name: attacker
    hostname: attacker
    networks:
      otlab:
        ipv4_address: 172.20.0.12
    depends_on:
      - modbus-slave
    tty: true
    stdin_open: true

  zeek:
    image: zeek/zeek:latest
    container_name: zeek
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ./zeek/logs:/logs
      - ./zeek/local.zeek:/usr/local/zeek/share/zeek/site/local.zeek:ro
      - ./zeek/scripts:/usr/local/zeek/share/zeek/site/scripts:ro
    working_dir: /logs
    command: ["zeek", "-C", "-i", "br-otlab", "local"]
    depends_on:
      - modbus-master
      - modbus-slave
    restart: unless-stopped
